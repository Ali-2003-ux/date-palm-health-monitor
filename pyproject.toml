# Project tooling configuration. The application itself is configured
# through .env (see backend/core/config.py); this file only holds
# lint/test tool settings.

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint.per-file-ignores]
# FastAPI idiom: Query()/Form()/File()/Depends() calls in signature defaults
"backend/api/**" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

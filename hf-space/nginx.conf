worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    access_log /dev/stdout;
    client_max_body_size 20m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 7860;

        # ---- API (FastAPI) ----
        location /api/   { proxy_pass http://127.0.0.1:8000; }
        location /media/ { proxy_pass http://127.0.0.1:8000; }
        location = /health      { proxy_pass http://127.0.0.1:8000; }
        location = /docs        { proxy_pass http://127.0.0.1:8000; }
        location /docs/         { proxy_pass http://127.0.0.1:8000; }
        location = /redoc       { proxy_pass http://127.0.0.1:8000; }
        location = /openapi.json { proxy_pass http://127.0.0.1:8000; }

        # ---- Dashboard (Streamlit, incl. websockets) ----
        location / {
            proxy_pass http://127.0.0.1:8501;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }
    }
}

# Alembic configuration for the Date Palm Health Monitoring System.
#
# The database URL is NOT stored here — migrations/env.py reads it from the
# application settings (.env / DATABASE_URL), so the CLI and the app always
# target the same database. Override per-invocation with:
#   DATABASE_URL=... alembic upgrade head
# Generate offline SQL (no server needed) with:
#   DATABASE_URL=postgresql+psycopg2://user:pass@host/db alembic upgrade head --sql

[alembic]
script_location = %(here)s/migrations
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os
# Overridden by migrations/env.py at runtime:
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
